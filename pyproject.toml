[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cached-response"
version = "0.1.0"
description = "Local exact function caching and opt-in LLM response caching."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "haoxuw"}]
dependencies = []
keywords = ["llm", "cache", "testing", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Source = "https://github.com/haoxuw/cached-response"
Documentation = "https://github.com/haoxuw/cached-response#readme"
Issues = "https://github.com/haoxuw/cached-response/issues"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]

[project.scripts]
cached-response = "cached_response.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cached_response"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
